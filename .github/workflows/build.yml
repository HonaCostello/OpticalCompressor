name: Build Optical Compressor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install dependencies
      run: |
        # No extra dependencies needed for macOS JUCE build usually

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpticalCompressor-macOS
        path: |
          build/OpticalCompressor_artefacts/Release/VST3/The Godfather.vst3
          build/OpticalCompressor_artefacts/Release/AU/The Godfather.component
